        if (!prev) return;
        pts[e.pointerId] = { x: e.clientX, y: e.clientY };
        if (panning) {
          var n = Object.keys(pts).length;
          scroller.scrollLeft -= (e.clientX - prev.x) / n; scroller.scrollTop -= (e.clientY - prev.y) / n;
          return;
        }
        if (!cur) return;
        if (Math.abs(e.clientX - lastPx.x) + Math.abs(e.clientY - lastPx.y) < 2) return;
        lastPx = { x: e.clientX, y: e.clientY };
        var p = pt(e);
        cur.p.push(p);
        Q.paintSeg(ctx, cur, N, N, cur.p.length - 2);
        if (cur.p.length >= 450) { finish(); begin(p); }
      });
      var up = function (e) {
        delete pts[e.pointerId];
        if (!Object.keys(pts).length) { panning = false; finish(); endGesture(); }
      };
      cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    } else {
      var drag = null;
      cv.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY }; try { cv.setPointerCapture(e.pointerId); } catch (x) {} });
      cv.addEventListener('pointermove', function (e) { if (!drag) return; scroller.scrollLeft -= e.clientX - drag.x; scroller.scrollTop -= e.clientY - drag.y; drag = { x: e.clientX, y: e.clientY }; });
      cv.addEventListener('pointerup', function () { drag = null; });
      root.appendChild(el('div', { class: 'off', text: 'Le dessin est désactivé dans l’aperçu.' }));
    }

    var tools = el('div', { class: 'wall-tools' });
    var swatches = COLORS.map(function (c) {
      var b = el('button', { type: 'button', class: 'sw', 'aria-label': 'Couleur ' + c, style: { background: c } });
      b.addEventListener('click', function () { color = c; tool = 'draw'; sync(); });
      tools.appendChild(b); return b;
    });
    function tb(text, fn, label) { var b = el('button', { type: 'button', class: 'tb', text: text, 'aria-label': label || text }); b.addEventListener('click', fn); return b; }
    var eraser = tb('Gomme', function () { color = 'erase'; tool = 'draw'; sync(); });
    var wbtns = WIDTHS.map(function (w) { return tb(w[0], function () { width = w[1]; sync(); }); });
    var undoB = tb('↶', function () { doUndo(); }, 'Annuler le dernier trait');
    var redoB = tb('↷', function () { doRedo(); }, 'Rétablir');
    function doUndo() {
      if (!undoS.length || preview) return;
      var g = undoS.pop(); redoS.push(g);
      st.undo(g.map(function (x) { return x.k; })); sync();
    }
    function doRedo() {
      if (!redoS.length || preview) return;
      var g = redoS.pop(), ng = g.map(function (x) {
        var k = Math.random().toString(36).slice(2, 10); st.mine[k] = 1;
        return { c: x.c, w: x.w, p: x.p, k: k, s: 2 };
      });
      ng.forEach(function (x) { st.local(x, null); });
      undoS.push(ng); sync();
    }
    function onKey(e) {
      if (!(e.ctrlKey || e.metaKey) || /input|textarea/i.test((e.target || {}).tagName || '')) return;
      var key = (e.key || '').toLowerCase();
      if (key === 'z' && !e.shiftKey) { e.preventDefault(); doUndo(); }
      else if (key === 'y' || (key === 'z' && e.shiftKey)) { e.preventDefault(); doRedo(); }
    }
    document.addEventListener('keydown', onKey);
    var panBtn = tb('✋ Déplacer', function () { tool = tool === 'pan' ? 'draw' : 'pan'; sync(); }, 'Déplacer la vue');
    var zOut = tb('−', function () { zoom = Math.max(minZoom(), zoom / 1.5); applyZoom(true); }, 'Dézoomer');
    var zIn = tb('+', function () { zoom = Math.min(1.5, zoom * 1.5); applyZoom(true); }, 'Zoomer');
    var zAll = tb('Tout voir', function () { zoom = minZoom(); applyZoom(false); scroller.scrollLeft = scroller.scrollTop = 0; });
    var r1 = el('div', { class: 'trow' }, swatches), r2 = el('div', { class: 'trow' }, [eraser].concat(wbtns)), r3 = el('div', { class: 'trow' }, [undoB, redoB, panBtn, zOut, zIn, zAll]);
    tools.replaceChildren(r1, r2, r3);
    function sync() {
      swatches.forEach(function (b, i) { b.setAttribute('aria-pressed', String(COLORS[i] === color)); });
      eraser.setAttribute('aria-pressed', String(color === 'erase'));
      wbtns.forEach(function (b, i) { b.setAttribute('aria-pressed', String(WIDTHS[i][1] === width)); });
      panBtn.setAttribute('aria-pressed', String(tool === 'pan'));
      undoB.disabled = !undoS.length; redoB.disabled = !redoS.length;
      undoB.style.opacity = undoS.length ? 1 : .4; redoB.style.opacity = redoS.length ? 1 : .4;
      root.classList.toggle('pan', tool === 'pan');
    }
    sync();

    root.append(el('div', { class: 'wall-title', text: d.title || 'Dessine ici' }), tools);
    var node = root;
    if (asOverlay) {
      var close = el('button', { type: 'button', class: 'wall-close', text: '✕ Fermer' });
      close.addEventListener('click', function () { document.removeEventListener('keydown', onKey); var i = st.subs.indexOf(view); if (i >= 0) st.subs.splice(i, 1); root.remove(); });
      root.appendChild(close);
    }
    return { node: node, center: center };
  }

  /* ---------- livre d'or ---------- */
  function guestModule(cfg, ms) {
    var panel = el('section', { class: 'panel', style: ms }, el('h2', { text: cfg.guestbook.title || 'Livre d’or' }));
    var name = el('input', { type: 'text', maxlength: 40, placeholder: 'Ton prénom', 'aria-label': 'Ton prénom' });
    var body = el('textarea', { maxlength: 300, placeholder: 'Ton message', 'aria-label': 'Ton message' });
    var send = el('button', { type: 'submit', class: 'send', text: 'Envoyer' });
    var note = el('p', { class: 'note', role: 'status' });
    var form = el('form', { class: 'gb-form' }, name, body, send, note);
    var list = el('div', { class: 'msgs' });
    panel.append(form, list);
    if (preview) { send.disabled = true; note.textContent = 'L’envoi est désactivé dans l’aperçu.'; }

    function load() {
      if (document.hidden) return;
      Q.rest('messages?select=id,name,body,created_at&order=id.desc&limit=50').then(function (rows) {
        list.replaceChildren.apply(list, (rows || []).map(function (m) {
          var d = new Date(m.created_at);
          return el('div', { class: 'msg' }, el('b', { text: m.name || 'Anonyme' }), el('time', { text: isNaN(d) ? '' : d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) }), el('p', { text: m.body }));
        }));
        if (!rows || !rows.length) list.appendChild(el('p', { class: 'note', text: 'Sois le premier à écrire un mot.' }));
      }).catch(function () {});
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (preview) return;
      var txt = body.value.trim();
      if (!txt) { note.textContent = 'Écris un message avant d’envoyer.'; return; }
      var last = 0; try { last = +localStorage.getItem('qr_gb') || 0; } catch (x) {}
      if (Date.now() - last < 20000) { note.textContent = 'Attends quelques secondes avant d’envoyer un autre message.'; return; }
      send.disabled = true;
      Q.rest('messages', { method: 'POST', headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ name: name.value.trim().slice(0, 40), body: txt.slice(0, 300) }) })
        .then(function () { try { localStorage.setItem('qr_gb', String(Date.now())); } catch (x) {} body.value = ''; note.textContent = 'Merci, ton message est publié !'; load(); })
        .catch(function () { note.textContent = 'Envoi impossible pour le moment. Réessaie.'; })
        .then(function () { send.disabled = false; });
    });
    load(); every(load, 10000);
    return panel;
  }

  /* ---------- musique ---------- */
  function setupMusic(cfg) {
    if (!cfg.music.src) return;
    var src = Q.mediaUrl(cfg.music.src);
    if (preview) { app.appendChild(el('div', { class: 'chip', text: '♪ Musique active (muette dans l’aperçu)' })); return; }
    var gate = el('button', { type: 'button', class: 'gate' }, el('span', { text: cfg.music.gate || 'Touche pour entrer' }), el('span', { class: 'gate-i', text: '♪', 'aria-hidden': 'true' }));
    gate.addEventListener('click', function () {
      audio = new Audio(src);
      audio.loop = true;
      audio.volume = Math.min(1, Math.max(0, +cfg.music.volume || 0.6));
      var p = audio.play(); if (p && p.catch) p.catch(function () {});
      gate.remove();
      var mute = el('button', { type: 'button', class: 'mute', 'aria-label': 'Couper la musique', text: '♪' });
      mute.addEventListener('click', function () {
        audio.muted = !audio.muted;
        mute.classList.toggle('off', audio.muted);
        mute.setAttribute('aria-label', audio.muted ? 'Remettre la musique' : 'Couper la musique');
      });
      app.appendChild(mute);
    });
    app.appendChild(gate);
  }

  /* ---------- page complète ---------- */
  function rgba(hex, a) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return hex || '#fff';
    var n = parseInt(m[1], 16);
    return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function buttonNodes(c) {
    var out = [];
    c.buttons.forEach(function (b) {
      var u = Q.safeUrl(b.url);
      if (!u) return;
      var outline = b.fill === 'outline';
      var a = el('a', {
        class: 'btn s-' + (b.size || 'm') + ' sh-' + (b.shape || 'round') + (b.full ? ' full' : ''),
        href: u, target: '_blank', rel: 'noopener noreferrer', text: b.label || 'Ouvrir',
        style: outline ? { background: 'transparent', color: b.bg, borderColor: b.bg } : { background: b.bg, color: b.color, borderColor: b.bg }
      });
      out.push(el('div', { class: 'brow ba-' + (b.align || 'auto') }, a));
    });
    return out;
  }

  function render(raw) {
    stopAll();
    var c = Q.config(raw), t = c.text, bg = c.bg, card = c.layout === 'card';
    Q.loadFonts([t.font, t.bodyFont]);
    document.title = c.pageTitle || t.title || 'Lien';

    var hasMedia = (bg.type === 'image' || bg.type === 'video') && bg.media;
    var pageBg = bg.color;
    if (bg.type === 'gradient') pageBg = gradient(bg);
    document.body.style.background = pageBg;

    var page = el('div', { class: 'page' + (c.music.src ? ' music' : '') });
    var layers = [];

    if (!card) {
      var layer = el('div', { class: 'bg', style: { background: pageBg } });
      var m = hasMedia ? mediaNode(bg, false) : null;
      if (m) {
        var mo = +bg.mediaOpacity; if (!isFinite(mo)) mo = 1;
        m.style.opacity = String(Math.min(1, Math.max(0, mo)));
        layer.appendChild(m);
        layer.appendChild(el('div', { class: 'overlay', style: { background: bg.overlayColor, opacity: String(Math.min(1, Math.max(0, +bg.overlay || 0))) } }));
      }
      layers.push(layer);
    }

    var ms = { background: rgba(c.modStyle.bg, Math.min(1, Math.max(0, +c.modStyle.opacity || 0))), color: c.modStyle.color, borderRadius: Math.max(0, +c.modStyle.radius || 0) + 'px' };

    /* modules : où les mettre ? top / middle / bottom / left / right */
    var only = !!c.draw.only;
    var mods = [];
    if (c.draw.on && !only) mods.push({ place: c.draw.place, label: c.draw.title || 'Dessin', make: function () { return drawModule(c, ms); } });
    if (c.guestbook.on) {
      var gp = c.guestbook.place;
      if (only && gp !== 'left') gp = 'right';       // le grand mur occupe toute la page : le livre d'or passe en tiroir
      mods.push({ place: gp, label: c.guestbook.title || 'Livre d’or', make: function () { return guestModule(c, ms); } });
    }
    function at(p) { return mods.filter(function (x) { return (x.place || 'bottom') === p; }); }

    if (!only) {
      at('top').forEach(function (x) { page.appendChild(x.make()); });
      var hero = el('div', { class: 'hero v-' + t.pos + ' a-' + t.align + (t.shadow ? ' shadow' : '') });
      if (card && hasMedia) { var fm = mediaNode(bg, true); if (fm) hero.appendChild(fm); }
      if (t.title) hero.appendChild(el('h1', { text: t.title, style: { fontFamily: Q.fontStack(t.font), fontSize: 'min(' + (+t.size || 56) + 'px, ' + ((+t.size || 56) * 0.2) + 'vw)', color: t.color } }));
      if (t.body) hero.appendChild(el('p', { class: 'body', text: t.body, style: { fontFamily: Q.fontStack(t.bodyFont), fontSize: 'min(' + (+t.bodySize || 20) + 'px, ' + ((+t.bodySize || 20) * 0.28) + 'vw)', color: t.color } }));
      var cd = countdown(c.countdown);
      if (cd) { cd.style.color = t.color; hero.appendChild(cd); }
      at('middle').forEach(function (x) { hero.appendChild(x.make()); });
      var bn = buttonNodes(c);
      if (bn.length) hero.appendChild(el('nav', { class: 'btns', 'aria-label': 'Liens' }, bn));
      page.appendChild(hero);
      at('bottom').forEach(function (x) { page.appendChild(x.make()); });
    } else {
      at('top').concat(at('middle'), at('bottom')).forEach(function (x) { x.place = 'right'; });
    }

    var extra = [];
    if (only) {
      var w = wallFull(c, false);
      extra.push(w.node);
      setTimeout(w.center, 0);
    }
    /* tiroirs latéraux avec leur languette */
    ['left', 'right'].forEach(function (side) {
      var list = mods.filter(function (x) { return x.place === side; });
      if (!list.length) return;
      var edge = el('div', { class: 'edge ' + side });
      list.forEach(function (x) {
        var drawer = el('aside', { class: 'drawer ' + side, style: { background: ms.background, color: ms.color, borderRadius: '0' } });
        var handle = el('button', { type: 'button', class: 'handle', text: x.label, 'aria-expanded': 'false', style: { background: c.modStyle.bg, color: c.modStyle.color } });
        var closeB = el('button', { type: 'button', class: 'dclose', 'aria-label': 'Fermer', text: '✕' });
        function toggle(open) {
          drawer.classList.toggle('open', open);
          handle.setAttribute('aria-expanded', String(open));
          [].forEach.call(document.querySelectorAll('.drawer.open'), function (o) { if (o !== drawer) { o.classList.remove('open'); } });
        }
        handle.addEventListener('click', function () { toggle(!drawer.classList.contains('open')); });
        closeB.addEventListener('click', function () { toggle(false); });
        drawer.append(closeB, x.make());
        edge.appendChild(handle);
        extra.push(drawer);
      });
      extra.push(edge);
    });

    app.replaceChildren.apply(app, layers.concat([page], extra));
    setupMusic(c);
  }

  function go(raw) {
    var c = Q.config(raw);
    if (c.mode === 'redirect') {
      var u = Q.safeUrl(c.url);
      if (u) { location.replace(u); return; }
    }
    render(raw);
  }

  if (preview) {
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin) return;
      if (e.data && e.data.type === 'cfg') render(e.data.cfg);
    });
    window.parent.postMessage({ type: 'ready' }, location.origin);
  } else {
    Q.fetchConfig().catch(function () { return Q.fallbackConfig(); }).then(go).catch(function () {
      app.replaceChildren(el('p', { class: 'err', text: 'Page indisponible pour le moment. Réessaie dans un instant.' }));
    });
  }
})();
</script>
</body>
</html>
