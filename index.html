<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D1117">
<title>Lien</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: #0D1117; color: #fff; font: 400 16px/1.5 "Instrument Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .boot { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #97A3B6; }

  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .bg > img, .bg > video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bg iframe { position: absolute; top: 50%; left: 50%; width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.78vh; transform: translate(-50%, -50%); border: 0; pointer-events: none; }
  .bg .overlay { position: absolute; inset: 0; }

  .page { position: relative; z-index: 1; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
  .hero { flex: none; width: 100%; max-width: 44rem; margin: 0 auto; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; gap: 18px; padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom)); }
  .page.music .hero { padding-bottom: max(88px, calc(env(safe-area-inset-bottom) + 76px)); }
  .hero.v-top { justify-content: flex-start; }
  .hero.v-center { justify-content: center; }
  .hero.v-bottom { justify-content: flex-end; }
  .hero.a-left { align-items: flex-start; text-align: left; }
  .hero.a-center { align-items: center; text-align: center; }
  .hero.a-right { align-items: flex-end; text-align: right; }
  .hero.shadow h1, .hero.shadow .body, .hero.shadow .count, .hero.shadow .count-l { text-shadow: 0 2px 14px rgba(0, 0, 0, .55); }
  .hero.shadow .lnk { box-shadow: 0 2px 14px rgba(0, 0, 0, .25); }
  h1 { margin: 0; line-height: 1.05; letter-spacing: -.01em; overflow-wrap: anywhere; text-wrap: balance; max-width: 100%; }
  .body { margin: 0; white-space: pre-line; overflow-wrap: anywhere; max-width: 36ch; line-height: 1.45; }

  .frame { display: block; max-width: 100%; max-height: 60vh; max-height: 60svh; border-radius: 20px; background: #000; }
  iframe.frame { width: 100%; aspect-ratio: 16 / 9; border: 0; max-height: none; }

  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 60px; padding: 0 32px; border-radius: 18px; font: 700 1.2rem/1.1 "Instrument Sans", system-ui, sans-serif; text-decoration: none; text-align: center; max-width: 100%; transition: transform .15s; }
  .btn:active { transform: scale(.98); }
  .links { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 26rem; }
  .a-left .links { align-items: stretch; }
  .lnk { display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 8px 20px; border-radius: 14px; border: 2px solid currentColor; background: rgba(255, 255, 255, .12); font-weight: 600; text-decoration: none; text-align: center; overflow-wrap: anywhere; }
  :focus-visible { outline: 3px solid #8A9AFF; outline-offset: 3px; }

  .count-l { font-size: .85rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  .count { display: flex; flex-wrap: wrap; gap: 10px; font-size: 1.4rem; font-weight: 700; }
  .unit { display: flex; flex-direction: column; align-items: center; min-width: 64px; padding: 8px 10px; border-radius: 12px; background: rgba(0, 0, 0, .28); font-variant-numeric: tabular-nums; }
  .unit b { font-size: 1.8rem; line-height: 1.1; }
  .unit small { font-size: .7rem; opacity: .85; text-transform: uppercase; letter-spacing: .08em; }

  .panel { position: relative; z-index: 1; width: calc(100% - 32px); max-width: 36rem; margin: 0 auto 24px; padding: 16px; border-radius: 20px; background: rgba(255, 255, 255, .95); color: #121A26; box-shadow: 0 8px 30px rgba(0, 0, 0, .25); }
  .panel h2 { margin: 0 0 12px; font-size: 1.25rem; }
  .panel.only { margin-top: max(16px, env(safe-area-inset-top)); }
  .board { position: relative; width: 100%; max-width: calc(68svh * .75); aspect-ratio: 3 / 4; margin: 0 auto; border-radius: 12px; overflow: hidden; border: 1px solid #CDD5E0; }
  .board canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .board .off { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255, 255, 255, .7); color: #566274; font-size: .9rem; text-align: center; padding: 16px; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1.5px #CDD5E0; padding: 0; cursor: pointer; }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 3px #121A26; }
  .tb { min-height: 36px; padding: 0 12px; border: 1.5px solid #CDD5E0; border-radius: 10px; background: #fff; color: #121A26; font: 600 .9rem "Instrument Sans", system-ui, sans-serif; cursor: pointer; }
  .tb[aria-pressed="true"] { border-color: #121A26; background: #121A26; color: #fff; }
  .gb-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .gb-form input, .gb-form textarea { width: 100%; padding: 10px 12px; border: 1.5px solid #CDD5E0; border-radius: 10px; font: 400 1rem "Instrument Sans", system-ui, sans-serif; color: #121A26; background: #fff; }
  .gb-form textarea { min-height: 80px; resize: vertical; }
  .send { min-height: 46px; border: 0; border-radius: 12px; background: #121A26; color: #fff; font: 600 1rem "Instrument Sans", system-ui, sans-serif; cursor: pointer; }
  .send[disabled] { opacity: .6; cursor: default; }
  .note { margin: 0; font-size: .85rem; color: #566274; min-height: 1.2em; }
  .msgs { display: flex; flex-direction: column; gap: 10px; max-height: 50svh; overflow: auto; }
  .msg { padding: 10px 12px; border-radius: 12px; background: #EDF0F5; overflow-wrap: anywhere; }
  .msg b { display: block; font-size: .9rem; }
  .msg time { font-size: .75rem; color: #566274; }
  .msg p { margin: 4px 0 0; white-space: pre-line; }

  .gate { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; border: 0; background: rgba(0, 0, 0, .78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #fff; font: 700 clamp(1.6rem, 7vw, 2.4rem)/1.15 "Instrument Sans", system-ui, sans-serif; text-align: center; cursor: pointer; }
  .gate-i { font-size: 3rem; }
  .mute { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .6); color: #fff; font-size: 1.3rem; cursor: pointer; }
  .mute.off { opacity: .55; text-decoration: line-through; }
  .chip { position: fixed; right: 12px; bottom: 12px; z-index: 40; padding: 6px 12px; border-radius: 999px; background: rgba(0, 0, 0, .65); color: #fff; font-size: .8rem; }
  .err { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; color: #97A3B6; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<div id="app"><p class="boot">Chargement…</p></div>
<script src="shared.js"></script>
<script>
(function () {
  'use strict';
  var Q = window.QR;
  var preview = new URLSearchParams(location.search).get('preview') === '1';
  var app = document.getElementById('app');
  var timers = [];
  var audio = null;

  function el(tag, props) {
    var n = document.createElement(tag);
    props = props || {};
    for (var k in props) {
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'style') Object.assign(n.style, v);
      else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      for (var j = 0; j < kids.length; j++) {
        var c = kids[j];
        if (c == null || c === false) continue;
        n.append(c.nodeType ? c : document.createTextNode(c));
      }
    }
    return n;
  }
  function every(fn, ms) { timers.push(setInterval(fn, ms)); }
  function stopAll() { timers.forEach(clearInterval); timers = []; if (audio) { audio.pause(); audio = null; } }
  function gradient(bg) { return 'linear-gradient(' + (+bg.angle || 0) + 'deg, ' + bg.color + ', ' + bg.color2 + ')'; }

  /* ---------- médias de fond / de cadre ---------- */
  function mediaNode(bg, asFrame) {
    var src = Q.mediaUrl(bg.media);
    if (!src) return null;
    var yt = Q.ytId(bg.media);
    if (bg.type === 'image') {
      var img = el('img', { src: src, alt: '' });
      if (asFrame) img.className = 'frame';
      return img;
    }
    if (bg.type === 'video') {
      if (yt) {
        var f = el('iframe', { src: 'https://www.youtube.com/embed/' + yt + '?autoplay=1&mute=1&loop=1&playlist=' + yt + '&controls=0&modestbranding=1&playsinline=1', allow: 'autoplay; encrypted-media', title: 'Vidéo' });
        if (asFrame) f.className = 'frame';
        return f;
      }
      var v = el('video', { src: src, autoplay: true, loop: true, playsinline: true, muted: true });
      v.muted = true;
      if (asFrame) v.className = 'frame';
      var p = v.play(); if (p && p.catch) p.catch(function () {});
      return v;
    }
    return null;
  }

  /* ---------- compte à rebours ---------- */
  function countdown(cd) {
    var t = Date.parse(cd.date);
    if (!cd.on || isNaN(t)) return null;
    var box = el('div', { class: 'count', role: 'timer' });
    function unit(n, l) { return el('div', { class: 'unit' }, el('b', { text: String(n) }), el('small', { text: l })); }
    function tick() {
      var s = Math.max(0, Math.floor((t - Date.now()) / 1000));
      if (s === 0) { box.replaceChildren('C’est parti !'); return; }
      box.replaceChildren(unit(Math.floor(s / 86400), 'j'), unit(Math.floor(s % 86400 / 3600), 'h'), unit(Math.floor(s % 3600 / 60), 'min'), unit(s % 60, 's'));
    }
    tick(); every(tick, 1000);
    return el('div', null, cd.label ? el('div', { class: 'count-l', text: cd.label, style: { marginBottom: '8px' } }) : null, box);
  }

  /* ---------- mur de dessin ---------- */
  var COLORS = ['#121A26', '#E5322D', '#F59E0B', '#16A34A', '#2F4BFF', '#8A2F7A', '#FFFFFF'];
  var WIDTHS = [['Fin', 0.006], ['Moyen', 0.014], ['Gros', 0.03]];

  function cleanStroke(s) {
    if (!s || typeof s !== 'object' || !Array.isArray(s.p) || !s.p.length) return null;
    var col = (s.c === 'erase' || /^#[0-9a-fA-F]{6}$/.test(s.c)) ? s.c : '#121A26';
    var w = Math.min(0.1, Math.max(0.002, +s.w || 0.01));
    var p = [];
    for (var i = 0; i < s.p.length && i < 600; i++) {
      var a = s.p[i];
      if (Array.isArray(a) && isFinite(a[0]) && isFinite(a[1])) p.push([Math.min(1, Math.max(0, +a[0])), Math.min(1, Math.max(0, +a[1]))]);
    }
    return p.length ? { c: col, w: w, p: p, k: String(s.k || '') } : null;
  }
  function paintSeg(ctx, s, W, H, from) {
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.globalCompositeOperation = s.c === 'erase' ? 'destination-out' : 'source-over';
    ctx.strokeStyle = ctx.fillStyle = s.c === 'erase' ? '#000' : s.c;
    ctx.lineWidth = s.w * W;
    var p = s.p;
    if (p.length === 1) {
      ctx.beginPath(); ctx.arc(p[0][0] * W, p[0][1] * H, ctx.lineWidth / 2, 0, 6.2832); ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(p[from][0] * W, p[from][1] * H);
      for (var i = from + 1; i < p.length; i++) ctx.lineTo(p[i][0] * W, p[i][1] * H);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawModule(cfg) {
    var d = cfg.draw;
    var panel = el('section', { class: 'panel' + (d.only ? ' only' : '') });
    panel.appendChild(el('h2', { text: d.title || 'Dessine ici' }));
    var cv = el('canvas', { 'aria-label': 'Mur de dessin partagé' });
    var board = el('div', { class: 'board', style: { background: d.paper || '#ffffff' } }, cv);
    panel.appendChild(board);
    var ctx = cv.getContext('2d');
    var strokes = [], mine = {}, lastId = 0, color = COLORS[0], width = WIDTHS[1][1], cur = null;

    function size() {
      var r = board.getBoundingClientRect();
      if (!r.width) return;
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.width * 4 / 3 * dpr);
      redraw();
    }
    function redraw() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      strokes.forEach(function (s) { paintSeg(ctx, s, cv.width, cv.height, 0); });
    }
    function add(rows) {
      rows.forEach(function (r) {
        lastId = Math.max(lastId, r.id);
        var s = cleanStroke(r.stroke);
        if (!s || (s.k && mine[s.k])) return;
        strokes.push(s); paintSeg(ctx, s, cv.width, cv.height, 0);
      });
    }
    function loadAll() {
      Q.rest('drawings?select=id,stroke&order=id.asc&limit=3000').then(function (rows) { strokes = []; lastId = 0; ctx.clearRect(0, 0, cv.width, cv.height); add(rows || []); }).catch(function () {});
    }
    function poll() {
      if (document.hidden) return;
      Q.rest('drawings?select=id,stroke&id=gt.' + lastId + '&order=id.asc&limit=500').then(function (rows) {
        if (rows && rows.length) { add(rows); return; }
        if (lastId > 0) {
          Q.rest('drawings?select=id&order=id.desc&limit=1').then(function (m) { if (!m || !m.length) { strokes = []; lastId = 0; redraw(); } }).catch(function () {});
        }
      }).catch(function () {});
    }
    function send(s) {
      if (preview) return;
      Q.rest('drawings', { method: 'POST', headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ stroke: s }) }).catch(function () {});
    }
    function pt(e) {
      var r = cv.getBoundingClientRect();
      return [Math.round((e.clientX - r.left) / r.width * 1000) / 1000, Math.round((e.clientY - r.top) / r.height * 1000) / 1000];
    }
    function begin(p) {
      var k = Math.random().toString(36).slice(2, 10);
      mine[k] = 1;
      cur = { c: color, w: color === 'erase' ? width * 2.2 : width, p: [p], k: k };
      paintSeg(ctx, cur, cv.width, cv.height, 0);
    }
    function finish() {
      if (!cur) return;
      strokes.push(cur); send(cur); cur = null;
    }
    if (!preview) {
      cv.addEventListener('pointerdown', function (e) {
        e.preventDefault(); cv.setPointerCapture(e.pointerId); begin(pt(e));
      });
      cv.addEventListener('pointermove', function (e) {
        if (!cur) return;
        var p = pt(e), l = cur.p[cur.p.length - 1];
        if (Math.abs(p[0] - l[0]) + Math.abs(p[1] - l[1]) < 0.003) return;
        cur.p.push(p);
        paintSeg(ctx, cur, cv.width, cv.height, cur.p.length - 2);
        if (cur.p.length >= 450) { finish(); begin(p); }
      });
      ['pointerup', 'pointercancel'].forEach(function (n) { cv.addEventListener(n, finish); });
    } else {
      board.appendChild(el('div', { class: 'off', text: 'Le dessin est désactivé dans l’aperçu.' }));
    }

    var tools = el('div', { class: 'tools' });
    COLORS.forEach(function (c) {
      var b = el('button', { type: 'button', class: 'sw', 'aria-label': 'Couleur ' + c, 'aria-pressed': c === color ? 'true' : 'false', style: { background: c } });
      b.addEventListener('click', function () { color = c; sync(); });
      tools.appendChild(b);
    });
    var eraser = el('button', { type: 'button', class: 'tb', text: 'Gomme' });
    eraser.addEventListener('click', function () { color = 'erase'; sync(); });
    tools.appendChild(eraser);
    var wbtns = WIDTHS.map(function (w) {
      var b = el('button', { type: 'button', class: 'tb', text: w[0] });
      b.addEventListener('click', function () { width = w[1]; sync(); });
      tools.appendChild(b); return b;
    });
    function sync() {
      [].slice.call(tools.querySelectorAll('.sw')).forEach(function (b, i) { b.setAttribute('aria-pressed', COLORS[i] === color ? 'true' : 'false'); });
      eraser.setAttribute('aria-pressed', color === 'erase' ? 'true' : 'false');
      wbtns.forEach(function (b, i) { b.setAttribute('aria-pressed', WIDTHS[i][1] === width ? 'true' : 'false'); });
    }
    sync();
    panel.appendChild(tools);

    setTimeout(function () { size(); loadAll(); }, 0);
    if (window.ResizeObserver) new ResizeObserver(size).observe(board);
    every(poll, 5000);
    return panel;
  }

  /* ---------- livre d'or ---------- */
  function guestModule(cfg) {
    var panel = el('section', { class: 'panel' }, el('h2', { text: cfg.guestbook.title || 'Livre d’or' }));
    var name = el('input', { type: 'text', maxlength: 40, placeholder: 'Ton prénom', 'aria-label': 'Ton prénom' });
    var body = el('textarea', { maxlength: 300, placeholder: 'Ton message', 'aria-label': 'Ton message' });
    var send = el('button', { type: 'submit', class: 'send', text: 'Envoyer' });
    var note = el('p', { class: 'note', role: 'status' });
    var form = el('form', { class: 'gb-form' }, name, body, send, note);
    var list = el('div', { class: 'msgs' });
    panel.append(form, list);
    if (preview) { send.disabled = true; note.textContent = 'L’envoi est désactivé dans l’aperçu.'; }

    function load() {
      if (document.hidden) return;
      Q.rest('messages?select=id,name,body,created_at&order=id.desc&limit=50').then(function (rows) {
        list.replaceChildren.apply(list, (rows || []).map(function (m) {
          var d = new Date(m.created_at);
          return el('div', { class: 'msg' }, el('b', { text: m.name || 'Anonyme' }), el('time', { text: isNaN(d) ? '' : d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) }), el('p', { text: m.body }));
        }));
        if (!rows || !rows.length) list.appendChild(el('p', { class: 'note', text: 'Sois le premier à écrire un mot.' }));
      }).catch(function () {});
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (preview) return;
      var txt = body.value.trim();
      if (!txt) { note.textContent = 'Écris un message avant d’envoyer.'; return; }
      var last = 0; try { last = +localStorage.getItem('qr_gb') || 0; } catch (x) {}
      if (Date.now() - last < 20000) { note.textContent = 'Attends quelques secondes avant d’envoyer un autre message.'; return; }
      send.disabled = true;
      Q.rest('messages', { method: 'POST', headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ name: name.value.trim().slice(0, 40), body: txt.slice(0, 300) }) })
        .then(function () { try { localStorage.setItem('qr_gb', String(Date.now())); } catch (x) {} body.value = ''; note.textContent = 'Merci, ton message est publié !'; load(); })
        .catch(function () { note.textContent = 'Envoi impossible pour le moment. Réessaie.'; })
        .then(function () { send.disabled = false; });
    });
    load(); every(load, 10000);
    return panel;
  }

  /* ---------- musique ---------- */
  function setupMusic(cfg) {
    if (!cfg.music.src) return;
    var src = Q.mediaUrl(cfg.music.src);
    if (preview) { app.appendChild(el('div', { class: 'chip', text: '♪ Musique active (muette dans l’aperçu)' })); return; }
    var gate = el('button', { type: 'button', class: 'gate' }, el('span', { text: cfg.music.gate || 'Touche pour entrer' }), el('span', { class: 'gate-i', text: '♪', 'aria-hidden': 'true' }));
    gate.addEventListener('click', function () {
      audio = new Audio(src);
      audio.loop = true;
      audio.volume = Math.min(1, Math.max(0, +cfg.music.volume || 0.6));
      var p = audio.play(); if (p && p.catch) p.catch(function () {});
      gate.remove();
      var mute = el('button', { type: 'button', class: 'mute', 'aria-label': 'Couper la musique', text: '♪' });
      mute.addEventListener('click', function () {
        audio.muted = !audio.muted;
        mute.classList.toggle('off', audio.muted);
        mute.setAttribute('aria-label', audio.muted ? 'Remettre la musique' : 'Couper la musique');
      });
      app.appendChild(mute);
    });
    app.appendChild(gate);
  }

  /* ---------- page complète ---------- */
  function render(raw) {
    stopAll();
    var c = Q.config(raw), t = c.text, bg = c.bg, card = c.layout === 'card';
    Q.loadFonts([t.font, t.bodyFont]);
    document.title = t.title || 'Lien';

    var hasMedia = (bg.type === 'image' || bg.type === 'video') && bg.media;
    var pageBg = bg.color;
    if (bg.type === 'gradient') pageBg = gradient(bg);
    document.body.style.background = pageBg;

    var page = el('div', { class: 'page' + (c.music.src ? ' music' : '') });
    var layers = [];

    if (!card) {
      var layer = el('div', { class: 'bg' });
      var m = hasMedia ? mediaNode(bg, false) : null;
      if (m) {
        layer.appendChild(m);
        layer.appendChild(el('div', { class: 'overlay', style: { background: bg.overlayColor, opacity: String(Math.min(1, Math.max(0, +bg.overlay || 0))) } }));
      } else {
        layer.style.background = pageBg;
      }
      layers.push(layer);
    }

    if (!c.draw.only) {
      var hero = el('div', { class: 'hero v-' + t.pos + ' a-' + t.align + (t.shadow ? ' shadow' : '') });
      if (card && hasMedia) { var fm = mediaNode(bg, true); if (fm) hero.appendChild(fm); }
      if (t.title) hero.appendChild(el('h1', { text: t.title, style: { fontFamily: Q.fontStack(t.font), fontSize: 'min(' + (+t.size || 56) + 'px, ' + ((+t.size || 56) * 0.2) + 'vw)', color: t.color } }));
      if (t.body) hero.appendChild(el('p', { class: 'body', text: t.body, style: { fontFamily: Q.fontStack(t.bodyFont), fontSize: 'min(' + (+t.bodySize || 20) + 'px, ' + ((+t.bodySize || 20) * 0.28) + 'vw)', color: t.color } }));
      var cd = countdown(c.countdown);
      if (cd) { cd.style.color = t.color; hero.appendChild(cd); }
      var burl = Q.safeUrl(c.button.url || c.url);
      if (c.button.show && burl) hero.appendChild(el('a', { class: 'btn', href: burl, target: '_blank', rel: 'noopener noreferrer', text: c.button.label || 'Ouvrir', style: { background: c.button.bg, color: c.button.color } }));
      var links = (c.links || []).filter(function (l) { return l && l.label && Q.safeUrl(l.url); });
      if (links.length) hero.appendChild(el('nav', { class: 'links', 'aria-label': 'Liens' }, links.map(function (l) {
        return el('a', { class: 'lnk', href: Q.safeUrl(l.url), target: '_blank', rel: 'noopener noreferrer', text: l.label, style: { color: t.color } });
      })));
      page.appendChild(hero);
    }
    if (c.draw.on) page.appendChild(drawModule(c));
    if (c.guestbook.on) page.appendChild(guestModule(c));

    app.replaceChildren.apply(app, layers.concat([page]));
    setupMusic(c);
  }

  function go(raw) {
    var c = Q.config(raw);
    if (c.mode === 'redirect') {
      var u = Q.safeUrl(c.url);
      if (u) { location.replace(u); return; }
    }
    render(raw);
  }

  if (preview) {
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin) return;
      if (e.data && e.data.type === 'cfg') render(e.data.cfg);
    });
    window.parent.postMessage({ type: 'ready' }, location.origin);
  } else {
    Q.fetchConfig().catch(function () { return Q.fallbackConfig(); }).then(go).catch(function () {
      app.replaceChildren(el('p', { class: 'err', text: 'Page indisponible pour le moment. Réessaie dans un instant.' }));
    });
  }
})();
</script>
</body>
</html>
